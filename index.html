  async function open(pass) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data));

    go.disabled = true; msg.textContent = "";
    try {
      const html = await open(pass.trim().toLowerCase());
      try { sessionStorage.setItem("ows", pass); } catch (e) {}
      document.open(); document.write(html); document.close();
    } catch (e) {
      go.disabled = false;
      if (!quiet) { msg.textContent = (window.crypto && crypto.subtle) ? "That is not the password. Try again." : "This browser cannot open the page. Try a current browser over https."; pw.select(); }

  let saved = null; try { saved = sessionStorage.getItem("ows"); } catch (e) {}
  if (saved) attempt(saved, true); // stay unlocked on reload within the same tab
